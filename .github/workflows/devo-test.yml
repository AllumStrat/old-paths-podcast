name: Devo test

# Manual end-to-end check of the Kobo devo: builds the committed sample
# (scripts/fixtures/devo-sample.md) with real ESV text and uploads it to Dropbox.
# Publishes no podcast episode. Run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/podcast.py devo-build scripts/fixtures/devo-sample.md --out "$RUNNER_TEMP/devo-test.epub" --plan-day 10-14 --deliver
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
